<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Web Player: Music for everyone</title>
    <link rel="icon" href="favicon/spoti.png" type="image/png">


    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- CONTAINER START -->
    <div class="container flex bg-black">

        <!-- LEFT SIDEBAR START -->
        <div class="left">
            <div class="close">
                <img width="40" class="invert" src="close.svg" alt="">
            </div>

            <!-- HOME SECTION START -->
            <div class="home bg-grey p-1 m-1 rounded">
                <div class="logo">
                    <img class="invert" src="logo.svg" alt="logo">
                </div>

                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search.svg" alt="search">Search</li>
                </ul>
            </div>
            <!-- HOME SECTION END -->

            <!-- LIBRARY SECTION START -->
            <div class="library rounded bg-grey p-1 m-1">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="">
                    <h2>Your Library</h2>
                </div>

                <div class="songList">
                    <ul>
                        <li>
                            <img class="invert" src="play.svg" alt="">
                            <div class="info">
                                <div>Song Name</div>
                                <div>Song Artist</div>
                            </div>

                            <div class="playnow">
                                <span>Play Now</span>
                                <img class="invert" src="play.svg" alt="">
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
            <!-- LIBRARY SECTION END -->

        </div>
        <!-- LEFT SIDEBAR END -->


        <!-- RIGHT SECTION START -->
        <div class="right rounded bg-grey p-1">

            <!-- HEADER START -->
            <div class="header">
                <div class="nav">
                    <img width="40px" class="invert hamburger" src="hamburger.svg" alt="">
                    <i class="fa-solid fa-angle-left"></i>
                    <i class="fa-solid fa-angle-right"></i>
                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign Up</button>
                    <button class="loginbtn">Log In</button>
                </div>
            </div>
            <!-- HEADER END -->


            <!-- SPOTIFY PLAYLISTS START -->
            <div class="spotifyPlaylists" style="margin: 30px;">
                <h1 class="playlisth11">Spotify Playlists</h1>

                <div class="cardContainer">
                    <!-- <div class="card">
                        <div class="play">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <img src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/radio/artist/3Z3yPo3SbczpDs4FpY9ixA/en" alt="">
                        <h1>Happy Hits!</h1>
                        <p>Hits to boost your mood and fill you with happiness</p>
                    </div>

                    <div class="card">
                        <div class="play">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <img src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/radio/artist/3Z3yPo3SbczpDs4FpY9ixA/en" alt="">
                        <h1>Happy Hits!</h1>
                        <p>Hits to boost your mood and fill you with happiness</p>
                    </div> -->
                </div>


                <!-- UPDATED PLAYBAR -->
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle"></div>
                    </div>

                    <div class="songinfo"></div>

                    <div class="songbuttons">
                        <img src="previous.svg" alt="">
                        <img src="play.svg" alt="">
                        <img src="nextsong.svg" alt="">
                    </div>

                    <div class="songtime">00:00</div>

                    <div class="volume">
                        <img width="30px" class="invert" src="volume.svg" alt="">
                        <div class="range">
                            <input type="range" name="volume" id="">
                        </div>
                    </div>
                </div>
                <!-- PLAYBAR END -->

            </div>
            <!-- SPOTIFY PLAYLISTS END -->

        </div>
        <!-- RIGHT SECTION END -->

    </div>
    <!-- CONTAINER END -->

    <script src="main.js"></script>
</body>

</html>
